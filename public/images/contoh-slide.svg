  </text>
  
  <!-- Decorative Elements -->
  <circle cx="200" cy="200" r="80" fill="#fbbf24" opacity="0.3"/>
  <circle cx="1720" cy="880" r="100" fill="#fbbf24" opacity="0.3"/>
  <circle cx="400" cy="900" r="60" fill="#60a5fa" opacity="0.4"/>
  <circle cx="1600" cy="180" r="70" fill="#60a5fa" opacity="0.4"/>
